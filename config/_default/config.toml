# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/configuration/

# The theme comes in as a Hugo Module (see module.toml). Do not also set
# `theme` here: Hugo then imports Congo twice and prints a build warning.
baseURL = "https://beimgraben.net/"
defaultContentLanguage = "de"
enableRobotsTXT = true
# Congo falls back to .Summary for the meta description of a page that sets no
# `description`. At 0 that summary is empty, which shipped an empty description.
summaryLength = 30

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.plausible]
  enable = true
  domain = "beimgraben.net"
  # Own instance. The module builds the script URL from this:
  # https://<selfhosted_domain>/js/script.outbound-links.js
  selfhosted_domain = "plausible.beimgraben.net"
  outbound_link = true
  # The theme selection no longer lives in the URL fragment, so Plausible must
  # not split page views on it.
  hash_based_routing = false
  # Silences the module's "leave a star on GitHub" build warning.
  gitstar = false
