# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/configuration/

theme = "github.com/jpanther/congo/v2"
baseURL = "https://beimgraben.net/"
defaultContentLanguage = "de"
enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params.plausible]
  enable = true
  domain = "beimgraben.net"
  selfhosted_domain = "plausible.reutlingen.university"
  outbound_link = true
  hash_based_routing = true
