# Build the site on every push to main and every pull request, keep the result
# as a downloadable artifact, and copy a push to main into the document root.
#
# The server has had no hugo since 29918110, so it cannot build the site. CI
# builds it and writes the result over SSH, with the same flags publish.sh
# uses, so what this deploys is what a local publish would have deployed.
# publish.sh stays as the manual path.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same ref makes the older build pointless. On main it
# does not: cancelling there can stop a run in the middle of `rsync --delete`
# and leave the live document root half emptied. Queue those instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The theme and plausible-hugo come in as Hugo Modules, so the build
      # needs a Go toolchain to fetch them. go.mod names the version, and
      # go.sum keys the module cache.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Hugo
        env:
          # Keep in step with the hugo in flake.nix's nixpkgs, which is what
          # publish.sh builds with. Read that version with
          #   nix eval --raw --impure --expr \
          #     '(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.hugo.version'
          # and take the digest from the release's checksums file. Nothing
          # checks that the two agree, and they had already drifted once: this
          # pin said 0.151.0 while the lock had moved to 0.152.2, so CI was not
          # building what publish.sh builds. The extended build is what the
          # theme expects.
          HUGO_VERSION: 0.152.2
          HUGO_SHA256: 416bcfbdf5f68469ec9644dbe507da50fc21b94b69a125b059d64ed2cb4d8c27
        run: |
          set -euo pipefail
          curl -sSLo hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum --check --strict -
          tar -xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          rm hugo hugo.tar.gz
          hugo version

      - name: Build
        run: |
          set -euo pipefail
          # The same flags publish.sh uses, so this builds what a deploy would.
          hugo --gc --minify
          # publish.sh copies this in afterwards: the Search Console token sits
          # at the repo root rather than under static/, so hugo never sees it.
          cp google*.html public/

      # hugo exits 0 on some configuration mistakes that leave no pages, and
      # publish.sh refuses to rsync such a build. Fail here for the same reason.
      - name: Check the build produced a site
        run: test -s public/index.html

      - uses: actions/upload-artifact@v4
        with:
          # On a pull_request event github.sha is the ephemeral merge commit,
          # which exists in no branch, so name the artifact after the commit a
          # reader can actually check out.
          name: site-${{ github.event.pull_request.head.sha || github.sha }}
          path: public/
          if-no-files-found: error
          retention-days: 14

      - name: Copy the site into the document root
        # A pull request build stops at the artifact. GitHub keeps secrets away
        # from a run that a fork starts, and this condition says the same thing
        # again, where a reader can see it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          # The host key of beimgraben.net. StrictHostKeyChecking=accept-new
          # would trust whatever answers, because each runner is new and every
          # run is therefore a first contact.
          KNOWN_HOST: beimgraben.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC419qNR144IiW66vCnljvz1iiT5HRS7/wmbO7R5SYay
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$KNOWN_HOST" > "$RUNNER_TEMP/known_hosts"
          # The key on the server carries command="rrsync -wo /var/www/home",
          # so `.` is the root of that directory and no other path is
          # reachable. rrsync refuses `:/` as an unsafe arg. It also disables
          # -K, -L and -k when it restricts a subdirectory, so those must stay
          # out of the flags. -rlc --delete is what publish.sh sends.
          rsync -rlc --delete \
            -e "ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            public/ webdeploy@beimgraben.net:.

      - name: The deployed site must answer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -fsS --retry 3 --retry-delay 2 -o /dev/null https://beimgraben.net/
