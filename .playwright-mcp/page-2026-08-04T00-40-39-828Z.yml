          - generic [ref=e53]:
            - paragraph [ref=e54]:
              - text: I recently finished my latest project,
              - strong [ref=e55]: GANGWAY
              - text: (it’s a stupid recursive acronym), and I wanted to share a behind-the-scenes look at how it works. It’s an interactive lighting installation that reacts to people walking through it at the hallway to the
              - link "FSI Reutlingen" [ref=e56] [cursor=pointer]:
                - /url: https://www.fsireutlingen.de/
              - text: .
            - heading "The Hardware Anker" [level=2] [ref=e57]:
              - text: The Hardware
              - link "Anker" [ref=e59] [cursor=pointer]:
                - /url: "#the-hardware"
                - text: "#"
            - paragraph [ref=e60]:
              - text: The core of the system is a
              - strong [ref=e61]: Raspberry Pi 4B
              - text: controlling nine 2m long LED strips suspended from the ceiling. I’m using
              - strong [ref=e62]: WS2805
              - text: strips, which required writing a custom Python driver (a modified version of
              - code [ref=e63]: "`rpi-ws281x`"
              - text: ) to handle the specific protocol quirks properly.
            - heading "Making it Interactive Anker" [level=2] [ref=e64]:
              - text: Making it Interactive
              - link "Anker" [ref=e66] [cursor=pointer]:
                - /url: "#making-it-interactive"
                - text: "#"
            - paragraph [ref=e67]:
              - text: The real magic happens with the sensor integration. I installed a
              - strong [ref=e68]: XOVIS PC2-L
              - text: person counter to track movement in the area.
            - paragraph [ref=e69]: Instead of just triggering a simple motion sensor event, the system actually tracks the specific coordinates of people. I implemented a homographic projection (projection mapping) pipeline that translates the camera’s view directly onto the floor plan of the LED installation. This means if you stand in a specific spot, the lights tracking you are physically accurate to your location.
            - heading "Recursive Animations in Python Anker" [level=2] [ref=e70]:
              - text: Recursive Animations in Python
              - link "Anker" [ref=e72] [cursor=pointer]:
                - /url: "#recursive-animations-in-python"
                - text: "#"
            - paragraph [ref=e73]: On the software side, I built a procedural animation engine in Python. The coolest feature is the ability to recursively nest animations.
            - paragraph [ref=e74]: "Instead of writing one massive function for a complex effect, I can compose them like this:"
            - code [ref=e78]:
              - generic [ref=e80]: "# Create a complex behavior by nesting simple functions"
              - generic [ref=e82]: animation = schedule(
              - generic [ref=e84]: primary=proximity_speed(
              - generic [ref=e86]: animation=blend(rainbow(), sparkle()),
              - generic [ref=e88]: mode="speed up"
              - generic [ref=e90]: ),
              - generic [ref=e92]: secondary=idle_wave(),
              - generic [ref=e94]: start="18:00",
              - generic [ref=e96]: end="06:00"
              - generic [ref=e98]: )
            - paragraph [ref=e99]: This functional approach makes the system incredibly flexible.
            - heading "Check it out Anker" [level=2] [ref=e100]:
              - text: Check it out
              - link "Anker" [ref=e102] [cursor=pointer]:
                - /url: "#check-it-out"
                - text: "#"
            - paragraph [ref=e103]:
              - text: It’s been a fun challenge combining hardware, low-level driver code, and high-level visual logic. You can check out the full technical documentation and code on
              - link "GitHub" [ref=e104] [cursor=pointer]:
                - /url: https://github.com/frederikbeimgraben/gangway
              - text: .
